[project]
name = "mstr-rest-requests"
version = "2.0.0"
description = "Easily make requests of the MicroStrategy REST API"
authors = [{ name = "Paul Bailey", email = "bailey@dreamshake.net" }]
requires-python = ">=3.10, <4"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28.1",
    "anyio>=4",
]

[project.optional-dependencies]
aws = ["boto3"]
azure = ["azure-identity", "azure-keyvault-secrets"]
gcp = ["google-cloud-secret-manager"]
docs = ["sphinx>=8.1,<10", "sphinx-rtd-theme>=3"]
requests = ["requests", "requests-toolbelt"]
# httpx is a core dependency since 2.0; these are kept so existing
# install commands keep working.
async = []
httpx = []

[project.urls]
Documentation = "https://mstr-rest-requests.readthedocs.io/"
Repository = "https://github.com/paulbailey/mstr-rest-requests"

[dependency-groups]
dev = [
    "pytest",
    "sphinx>=8.1,<10",
    "sphinx-rtd-theme>=3",
    "pytest-cov>=7,<8",
    "mypy>=1.0.0,<2",
    "types-requests>=2.25.11,<3",
    "black>=26.1,<27",
    "pre-commit",
    "trio>=0.34.0",
]

[tool.hatch.build.targets.sdist]
include = ["mstr"]

[tool.hatch.build.targets.wheel]
include = ["mstr"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:The requests-based sessions in mstr.requests.compat:DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true

# Third-party packages without stubs
[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "requests_toolbelt",
    "requests_toolbelt.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
