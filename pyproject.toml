[project]
name = "mstr-rest-requests"
version = "2.3.1"
description = "Easily make requests of the MicroStrategy REST API"
authors = [{ name = "Paul Bailey", email = "bailey@dreamshake.net" }]
requires-python = ">=3.11, <4"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1",
    "anyio>=4",
]

[project.optional-dependencies]
aws = ["boto3"]
azure = ["azure-identity", "azure-keyvault-secrets"]
gcp = ["google-cloud-secret-manager"]
docs = ["sphinx>=8.1,<10", "sphinx-rtd-theme>=3"]
requests = ["requests", "requests-toolbelt"]
# httpx is a core dependency since 2.0; these are kept so existing
# install commands keep working.
async = []
httpx = []

[project.urls]
Documentation = "https://mstr-rest-requests.readthedocs.io/"
Repository = "https://github.com/paulbailey/mstr-rest-requests"

[dependency-groups]
dev = [
    "pytest",
    "sphinx>=8.1,<10",
    "sphinx-rtd-theme>=3",
    "pytest-cov>=7,<8",
    "types-requests>=2.25.11,<3",
    "ruff>=0.17.3,<0.18",
    "ty>=0.0.95",
    "pre-commit",
    "trio>=0.34.0",
]

[tool.uv.build-backend]
module-name = "mstr"
module-root = ""

[tool.pytest.ini_options]
markers = [
    "live: calls demo.microstrategy.com; skipped unless pytest is run with --live",
]
filterwarnings = [
    "ignore:The requests-based sessions in mstr.requests.compat:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["mstr"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"
