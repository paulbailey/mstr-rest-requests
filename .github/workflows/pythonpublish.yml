# This workflow publishes the package to PyPI using uv.
#
# On every push to main it reads the version from pyproject.toml. If there is
# no release tagged v<version> yet, it builds and uploads the package, then
# creates that GitHub release. To ship a new version, merge a PR that bumps
# the version in pyproject.toml and uv.lock.
#
# Creating a release by hand still publishes, as long as the tag matches the
# version. Releases created by this workflow use GITHUB_TOKEN, which does not
# trigger the release event, so nothing is published twice.
#
# Lint and tests (pythonpackage.yml) run as part of this workflow and must
# pass before anything is built or uploaded.
#
# Publishing stays in this file because PyPI trusted publishing is tied to
# the workflow's filename.
# For more information see: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-python#publishing-to-pypi

name: Upload Python Package

on:
  push:
    branches: [main]
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      create_release: ${{ steps.plan.outputs.create_release }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          python-version: "3.14"
          # Most pushes to main publish nothing, so nothing is cached and
          # setup-uv's cache step would fail the job.
          enable-cache: false
      - name: Decide whether to publish
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(uv version --short)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "release" ]; then
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Release tag $TAG does not match pyproject.toml version $VERSION (expected v$VERSION). Bump the version before releasing."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for v$VERSION yet; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/pythonpackage.yml
    secrets: inherit

  deploy:
    needs: [plan, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          python-version: "3.14"
          # Release builds should not use a cache.
          enable-cache: false
      - name: Build
        run: uv build
      # Signs each file in dist/ with this workflow's identity (PEP 740).
      # uv publish finds the .publish.attestation files and uploads them,
      # and PyPI shows them as provenance on the release's files.
      - name: Generate attestations
        uses: astral-sh/attest-action@v0.0.7
      - name: Publish
        # --check-url skips files already on PyPI, so a re-run after a
        # failed release step does not fail here. Attestations need
        # trusted publishing, so fail rather than fall back to a token.
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
      - name: Create GitHub release
        if: needs.plan.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
